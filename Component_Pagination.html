<style>
.gas-pagination { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.875rem 0.25rem 0.25rem; border-top: 1px solid #f1f5f9; margin-top: 0.5rem; }
@media (min-width: 640px) {
  .gas-pagination { flex-direction: row; align-items: center; justify-content: space-between; }
}
.gas-pagination-info { font-size: 0.75rem; color: #64748b; }
.gas-pagination-controls { display: flex; align-items: center; gap: 0.375rem; }
.gas-pagination-btn { 
  background: white; border: 1px solid #e2e8f0; padding: 0.375rem 0.75rem; 
  font-size: 0.75rem; border-radius: 0.5rem; cursor: pointer; color: #334155; font-weight: 600;
  transition: all 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.gas-pagination-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
.gas-pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.gas-pagination-badge {
  font-size: 0.75rem; font-weight: 600; color: #2563eb; background: #eff6ff; 
  padding: 0.375rem 0.625rem; border-radius: 0.5rem; border: 1px solid #dbeafe;
}
</style>

<script>
const Pagination = (function() {
  /**
   * config: {
   *   containerId: string,
   *   currentPage: number,
   *   pageSize: number,
   *   totalItems: number,
   *   onPageChange: function(newPage)
   * }
   */
  function render(config) {
    const container = document.getElementById(config.containerId);
    if (!container) return;

    const totalPages = Math.ceil(config.totalItems / config.pageSize) || 1;
    const currentPage = config.currentPage || 1;
    
    container.innerHTML = '';
    
    const wrapper = document.createElement('div');
    wrapper.className = 'gas-pagination';
    
    const infoDiv = document.createElement('div');
    infoDiv.className = 'gas-pagination-info';
    
    if (config.totalItems === 0) {
      infoDiv.innerText = 'Tidak ada data';
    } else {
      const startItem = (currentPage - 1) * config.pageSize + 1;
      const endItem = Math.min(currentPage * config.pageSize, config.totalItems);
      infoDiv.innerHTML = `Menampilkan <strong class="text-slate-800 font-semibold">${startItem}</strong> - <strong class="text-slate-800 font-semibold">${endItem}</strong> dari <strong class="text-slate-800 font-semibold">${config.totalItems}</strong> data`;
    }
    
    const controlsDiv = document.createElement('div');
    controlsDiv.className = 'gas-pagination-controls';
    
    // Tombol Sebelumnya
    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.className = 'gas-pagination-btn';
    prevBtn.innerHTML = `&larr; Prev`;
    prevBtn.disabled = currentPage <= 1;
    prevBtn.onclick = () => {
      if (currentPage > 1) {
        config.onPageChange(currentPage - 1);
      }
    };
    
    // Label Halaman
    const pageBadge = document.createElement('span');
    pageBadge.className = 'gas-pagination-badge';
    pageBadge.innerText = `${currentPage} / ${totalPages}`;

    // Tombol Selanjutnya
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.className = 'gas-pagination-btn';
    nextBtn.innerHTML = `Next &rarr;`;
    nextBtn.disabled = currentPage >= totalPages;
    nextBtn.onclick = () => {
      if (currentPage < totalPages) {
        config.onPageChange(currentPage + 1);
      }
    };
    
    controlsDiv.appendChild(prevBtn);
    controlsDiv.appendChild(pageBadge);
    controlsDiv.appendChild(nextBtn);
    
    wrapper.appendChild(infoDiv);
    wrapper.appendChild(controlsDiv);
    
    container.appendChild(wrapper);
  }

  return { render };
})();
</script>
