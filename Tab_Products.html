<div class="mb-5 flex items-center justify-between">
  <div>
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Katalog Produk (Products)</h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Kelola daftar produk, inventaris stok, dan harga jual</p>
  </div>
  <!-- Desktop Add Button -->
  <button id="btn-add-product" onclick="ProductsTab.openCreateModal()" class="app-desktop-inline items-center space-x-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    <span>Tambah Produk</span>
  </button>
</div>

<!-- Mobile Floating Action Button (FAB) -->
<button 
  id="fab-add-product"
  onclick="ProductsTab.openCreateModal()" 
  class="app-mobile-only fixed bottom-20 right-4 z-40 w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg shadow-blue-600/30 flex items-center justify-center transition-transform active:scale-95"
  title="Tambah Produk Cepat"
>
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
</button>

<div id="products-table-container"></div>

<script>
const ProductsTab = (function() {
  const tableContainerId = 'products-table-container';
  let isInitialized = false;

  function updateAccessUI() {
    const canCreate = typeof Auth !== 'undefined' && Auth.can('products', 'create');
    const desktopBtn = document.getElementById('btn-add-product');
    const fabBtn = document.getElementById('fab-add-product');
    if (desktopBtn) desktopBtn.style.display = canCreate ? '' : 'none';
    if (fabBtn) fabBtn.style.display = canCreate ? '' : 'none';
  }

  function prepareCategoryOptions() {
    if (typeof API === 'undefined' || !API.categories) {
      return Promise.resolve();
    }
    return API.categories.list()
      .then(categories => {
        if (categories && categories.length > 0 && typeof ProductSchema !== 'undefined' && ProductSchema.form) {
          const catField = ProductSchema.form.fields.find(f => f.key === 'category_id');
          if (catField) {
            catField.options = categories.map(c => ({
              value: c.id,
              label: c.name ? `${c.name} (${c.code || c.id})` : c.id
            }));
          }
        }
      })
      .catch(err => {
        console.warn('Could not load categories from API:', err);
      });
  }

  function init() {
    updateAccessUI();
    prepareCategoryOptions();
    if (!isInitialized) {
      loadData();
      isInitialized = true;
    } else {
      loadData(); // Reload data when switching back to tab
    }
  }

  function loadData() {
    updateAccessUI();
    if (typeof Loading !== 'undefined') Loading.show();

    const actions = [];
    // Aksi rincian stok per gudang
    actions.push({
      name: 'view-stock',
      label: 'Stok',
      className: 'inline-flex items-center px-2 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-md border border-emerald-200 transition-colors',
      icon: '<svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>'
    });

    if (typeof Auth !== 'undefined') {
      if (Auth.can('products', 'edit')) actions.push('edit');
      if (Auth.can('products', 'delete')) actions.push('delete');
    } else {
      actions.push('edit', 'delete');
    }


    API.products.list()
      .then(data => {
        if (typeof Table !== 'undefined') {
          Table.render({
            target: tableContainerId,
            data: data,
            columns: ProductSchema.columns,
            actions: actions,
            onAction: handleAction
          });
        }
      })
      .catch(err => {
        if (typeof Toast !== 'undefined') Toast.error(err.message);
        console.error(err);
      })
      .finally(() => {
        if (typeof Loading !== 'undefined') Loading.hide();
      });
  }

  function handleAction(action, row) {
    if (action === 'view-stock') {
      openStockBreakdownModal(row);
    } else if (action === 'edit') {
      openEditModal(row);
    } else if (action === 'delete') {
      if (typeof Auth !== 'undefined' && !Auth.can('products', 'delete')) {
        if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk menghapus produk.');
        else alert('Anda tidak memiliki izin untuk menghapus produk.');
        return;
      }
      if (confirm(`Are you sure you want to delete product: ${row.name}?`)) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.products.delete(row.id)
          .then(() => {
            if (typeof Toast !== 'undefined') Toast.success('Product deleted successfully');
            loadData();
          })
          .catch(err => {
            if (typeof Toast !== 'undefined') Toast.error(err.message);
          })
          .finally(() => {
            if (typeof Loading !== 'undefined') Loading.hide();
          });
      }
    }
  }

  function openStockBreakdownModal(product) {
    if (typeof Loading !== 'undefined') Loading.show();

    Promise.all([
      API.stocks.getByProduct(product.id),
      API.warehouses.list()
    ])
      .then(([stockRes, whRes]) => {
        let stocks = [];
        if (stockRes && stockRes.data && Array.isArray(stockRes.data)) {
          stocks = stockRes.data;
        } else if (Array.isArray(stockRes)) {
          stocks = stockRes;
        }

        let warehouses = [];
        if (whRes && whRes.data && Array.isArray(whRes.data)) {
          warehouses = whRes.data;
        } else if (Array.isArray(whRes)) {
          warehouses = whRes;
        }

        // Map seluruh gudang aktif
        const stockMap = {};
        stocks.forEach(s => {
          stockMap[s.warehouse_id] = Number(s.quantity) || 0;
        });

        let totalStock = 0;
        let rowsHtml = '';
        if (warehouses.length === 0) {
          rowsHtml = '<tr><td colspan="3" class="py-4 text-center text-slate-400 text-xs">Belum ada gudang terdaftar.</td></tr>';
        } else {
          warehouses.forEach(wh => {
            const qty = stockMap[wh.id] || 0;
            totalStock += qty;
            rowsHtml += `
              <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                <td class="py-2.5 px-3">
                  <span class="font-semibold text-slate-800 text-sm">${wh.name || wh.code}</span>
                  <span class="block text-[11px] text-slate-400 font-mono">${wh.code} &bull; ${wh.address || 'Tanpa alamat'}</span>
                </td>
                <td class="py-2.5 px-3 text-center">
                  <span class="gas-badge ${wh.status === 'active' ? 'gas-badge-success' : 'gas-badge-neutral'}">${wh.status || 'active'}</span>
                </td>
                <td class="py-2.5 px-3 text-right">
                  <span class="font-bold text-slate-900 font-mono text-sm">${qty.toLocaleString('id-ID')}</span>
                  <span class="text-xs text-slate-500 ml-1">${product.unit || 'pcs'}</span>
                </td>
              </tr>
            `;
          });
        }

        const modalBody = Modal.create({
          title: `Rincian Saldo Stok: ${product.name} (${product.code || product.id})`,
          onClose: () => {}
        });

        modalBody.innerHTML = `
          <div class="space-y-4">
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-3.5 flex items-center justify-between">
              <div>
                <span class="text-xs text-blue-600 font-semibold uppercase tracking-wider block">Total Konsolidasi Stok</span>
                <span class="text-xs text-slate-500 font-medium">Akumulasi seluruh lokasi gudang aktif</span>
              </div>
              <div class="text-right">
                <span class="text-xl font-extrabold text-blue-700 font-mono">${totalStock.toLocaleString('id-ID')}</span>
                <span class="text-xs font-bold text-blue-600 ml-1">${product.unit || 'pcs'}</span>
              </div>
            </div>

            <div class="overflow-hidden border border-slate-200 rounded-lg">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 uppercase tracking-wider">
                  <tr>
                    <th class="py-2.5 px-3 font-bold">Lokasi Gudang</th>
                    <th class="py-2.5 px-3 font-bold text-center">Status</th>
                    <th class="py-2.5 px-3 font-bold text-right">Saldo Fisik</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>

            <div class="pt-2 flex justify-end">
              <button type="button" onclick="Modal.hide()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                Tutup
              </button>
            </div>
          </div>
        `;
      })
      .catch(err => {
        console.error('Error fetching stock breakdown:', err);
        if (typeof Toast !== 'undefined') Toast.error(err.message || 'Gagal mengambil rincian stok gudang.');
      })
      .finally(() => {
        if (typeof Loading !== 'undefined') Loading.hide();
      });
  }


  function openCreateModal() {
    if (typeof Auth !== 'undefined' && !Auth.can('products', 'create')) {
      if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk menambah produk.');
      else alert('Anda tidak memiliki izin untuk menambah produk.');
      return;
    }
    if (typeof Modal === 'undefined' || typeof Form === 'undefined') return;

    if (typeof Loading !== 'undefined') Loading.show();

    prepareCategoryOptions().finally(() => {
      if (typeof Loading !== 'undefined') Loading.hide();

      const modalBody = Modal.create({
        title: 'Create Product',
        onClose: () => {}
      });
      modalBody.id = 'products-form-container';
      
      Form.render({
        containerId: 'products-form-container',
        schema: ProductSchema,
        mode: 'create',
        onSubmit: (data) => {
          if (typeof Loading !== 'undefined') Loading.show();
          API.products.create(data)
            .then(() => {
              Modal.hide();
              if (typeof Toast !== 'undefined') Toast.success('Product created successfully');
              loadData();
            })
            .catch(err => {
              if (typeof Toast !== 'undefined') Toast.error(err.message);
            })
            .finally(() => {
              if (typeof Loading !== 'undefined') Loading.hide();
            });
        },
        onCancel: () => Modal.hide()
      });
    });
  }

  function openEditModal(row) {
    if (typeof Auth !== 'undefined' && !Auth.can('products', 'edit')) {
      if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk mengubah produk.');
      else alert('Anda tidak memiliki izin untuk mengubah produk.');
      return;
    }
    if (typeof Modal === 'undefined' || typeof Form === 'undefined') return;

    if (typeof Loading !== 'undefined') Loading.show();

    prepareCategoryOptions().finally(() => {
      if (typeof Loading !== 'undefined') Loading.hide();

      // Ensure row.category_id exists in options
      const catField = ProductSchema.form && ProductSchema.form.fields && ProductSchema.form.fields.find(f => f.key === 'category_id');
      if (catField && catField.options && row.category_id && !catField.options.some(opt => opt.value === row.category_id)) {
        catField.options.push({ value: row.category_id, label: row.category_id });
      }

      const modalBody = Modal.create({
        title: 'Edit Product',
        onClose: () => {}
      });
      modalBody.id = 'products-form-container';
      
      Form.render({
        containerId: 'products-form-container',
        schema: ProductSchema,
        mode: 'edit',
        data: row,
        onSubmit: (data) => {
          if (typeof Loading !== 'undefined') Loading.show();
          API.products.update(row.id, data)
            .then(() => {
              Modal.hide();
              if (typeof Toast !== 'undefined') Toast.success('Product updated successfully');
              loadData();
            })
            .catch(err => {
              if (typeof Toast !== 'undefined') Toast.error(err.message);
            })
            .finally(() => {
              if (typeof Loading !== 'undefined') Loading.hide();
            });
        },
        onCancel: () => Modal.hide()
      });
    });
  }

  return { init, loadData, openCreateModal, openEditModal, prepareCategoryOptions };
})();

// Hook for Scripts.html
window.initProductsTab = function() {
  ProductsTab.init();
};
</script>
