<div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
  <div>
    <div class="flex items-center space-x-2">
      <span class="text-xl">🛒</span>
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Penjualan Toko (Sales Orders)</h1>
    </div>
    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Pencatatan transaksi kasir/toko langsung ke pelanggan &bull; Stok gudang/toko langsung terpotong otomatis</p>
  </div>
  <div class="flex items-center space-x-2">
    <!-- Tombol Khusus Penjualan (Utama bagi SPG & Staff) -->
    <button id="btn-add-so" onclick="OrdersTab.openCreateSalesModal()" class="inline-flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-4 py-2.5 rounded-lg text-xs sm:text-sm font-semibold shadow-sm transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span>+ Catat Penjualan Baru</span>
    </button>
    <!-- Tombol Pengadaan PO (Hanya tampil untuk Admin/Manager) -->
    <button id="btn-add-po" onclick="OrdersTab.openCreatePurchaseModal()" class="hidden items-center space-x-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2.5 rounded-lg text-xs sm:text-sm font-semibold shadow-sm transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      <span>+ Buat PO Pengadaan</span>
    </button>
  </div>
</div>

<!-- Type Switcher Tabs (Default ke SALES agar SPG langsung fokus ke Penjualan) -->
<div id="order-type-tabs" class="flex border-b border-slate-200 mb-4 space-x-6 text-sm">
  <button id="tab-btn-so" onclick="OrdersTab.switchType('SALES')" class="pb-2.5 font-bold text-emerald-600 border-b-2 border-emerald-600 transition-all flex items-center space-x-2">
    <span>🛒 Riwayat Penjualan (Sales)</span>
  </button>
  <button id="tab-btn-po" onclick="OrdersTab.switchType('PURCHASE')" class="pb-2.5 font-semibold text-slate-500 hover:text-slate-800 transition-all flex items-center space-x-2">
    <span>📥 Pengadaan Masuk (Purchase Orders)</span>
  </button>
</div>

<!-- Table Container -->
<div id="orders-table-container"></div>

<script>
const OrdersTab = (function() {
  const tableContainerId = 'orders-table-container';
  let currentType = 'SALES'; // Default ke SALES agar SPG tidak salah input ke Purchase!
  let isInitialized = false;
  let warehouseCache = [];
  let productCache = [];

  function updateAccessUI() {
    const user = typeof Auth !== 'undefined' ? Auth.getUser() : null;
    const role = (user && user.role ? user.role : '').toLowerCase();
    const isAdminOrManager = role === 'admin' || role === 'manager';

    const poBtn = document.getElementById('btn-add-po');
    const tabPoBtn = document.getElementById('tab-btn-po');
    
    // Sembunyikan fitur PO dari SPG/Staff agar tidak salah input
    if (poBtn) {
      if (isAdminOrManager) {
        poBtn.classList.remove('hidden');
        poBtn.classList.add('inline-flex');
      } else {
        poBtn.classList.add('hidden');
        poBtn.classList.remove('inline-flex');
      }
    }

    if (tabPoBtn) {
      tabPoBtn.style.display = isAdminOrManager ? '' : 'none';
    }
  }

  function init() {
    updateAccessUI();
    loadLookups();
    if (!isInitialized) {
      loadData();
      isInitialized = true;
    } else {
      loadData();
    }
  }

  function switchType(type) {
    currentType = type;
    const poBtn = document.getElementById('tab-btn-po');
    const soBtn = document.getElementById('tab-btn-so');

    if (type === 'PURCHASE') {
      if (poBtn) poBtn.className = 'pb-2.5 font-bold text-blue-600 border-b-2 border-blue-600 transition-all flex items-center space-x-2';
      if (soBtn) soBtn.className = 'pb-2.5 font-semibold text-slate-500 hover:text-slate-800 transition-all flex items-center space-x-2';
    } else {
      if (soBtn) soBtn.className = 'pb-2.5 font-bold text-emerald-600 border-b-2 border-emerald-600 transition-all flex items-center space-x-2';
      if (poBtn) poBtn.className = 'pb-2.5 font-semibold text-slate-500 hover:text-slate-800 transition-all flex items-center space-x-2';
    }
    loadData();
  }

  function loadLookups() {
    Promise.all([
      API.warehouses.list(),
      API.products.list()
    ]).then(([whRes, prdRes]) => {
      warehouseCache = (whRes && whRes.data) || whRes || [];
      productCache = (prdRes && prdRes.data) || prdRes || [];
    }).catch(err => {
      console.warn('Failed to preload lookups in Orders:', err);
    });
  }

  function loadData() {
    if (typeof Loading !== 'undefined') Loading.show();

    API.orders.list(currentType)
      .then(function(response) {
        let orders = [];
        if (response && response.data && Array.isArray(response.data)) {
          orders = response.data;
        } else if (Array.isArray(response)) {
          orders = response;
        }

        const actions = [
          {
            name: 'view-detail',
            label: 'Detail',
            className: 'inline-flex items-center px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-md border border-slate-200 transition-colors',
            icon: '<svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>'
          }
        ];

        if (currentType === 'PURCHASE') {
          actions.push({
            name: 'step-action',
            label: 'Aksi Status',
            className: 'inline-flex items-center px-2 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold rounded-md border border-blue-200 transition-colors',
            icon: '<svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
          });
        }

        Table.render({
          containerId: tableContainerId,
          columns: OrderSchema.columns,
          data: orders,
          searchable: true,
          pagination: true,
          pageSize: 10,
          actions: actions,
          onAction: handleAction
        });
      })
      .catch(function(err) {
        console.error('Error loading orders:', err);
        Toast.show(err.message || 'Gagal memuat data pesanan.', 'error');
      })
      .finally(function() {
        if (typeof Loading !== 'undefined') Loading.hide();
      });
  }

  function handleAction(action, row) {
    if (action === 'view-detail') {
      openDetailModal(row);
    } else if (action === 'step-action') {
      handlePurchaseWorkflow(row);
    }
  }

  function handlePurchaseWorkflow(order) {
    const canApprove = typeof Auth !== 'undefined' && Auth.can('orders', 'approve');

    if (order.status === 'draft') {
      if (!canApprove) {
        Toast.show('Hanya Admin yang dapat menyetujui Purchase Order (Approve PO).', 'warning');
        return;
      }
      if (confirm(`Setujui Purchase Order ${order.order_no || order.id}?`)) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.orders.approvePurchase(order.id)
          .then(res => {
            Toast.show('Purchase Order disetujui (Approved). Menunggu pengiriman dari pemasok.', 'success');
            loadData();
          })
          .catch(err => Toast.show(err.message || 'Gagal menyetujui PO.', 'error'))
          .finally(() => { if (typeof Loading !== 'undefined') Loading.hide(); });
      }
    } else if (order.status === 'approved') {
      if (confirm(`Tandai barang PO ${order.order_no || order.id} telah dikirim oleh pemasok (Shipped)?`)) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.orders.shipPurchase(order.id)
          .then(res => {
            Toast.show('Status PO diubah menjadi Shipped.', 'success');
            loadData();
          })
          .catch(err => Toast.show(err.message || 'Gagal mengubah status PO.', 'error'))
          .finally(() => { if (typeof Loading !== 'undefined') Loading.hide(); });
      }
    } else if (order.status === 'shipped') {
      if (confirm(`Konfirmasi penerimaan barang di gudang tujuan untuk PO ${order.order_no || order.id}? Saldo stok fisik akan langsung bertambah.`)) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.orders.receivePurchase(order.id)
          .then(res => {
            Toast.show('Barang PO telah diterima! Saldo stok gudang telah bertambah.', 'success');
            loadData();
          })
          .catch(err => Toast.show(err.message || 'Gagal menerima barang PO.', 'error'))
          .finally(() => { if (typeof Loading !== 'undefined') Loading.hide(); });
      }
    } else if (order.status === 'received') {
      Toast.show('Purchase Order ini sudah selesai dan stok telah masuk.', 'info');
    }
  }

  function openDetailModal(order) {
    if (typeof Loading !== 'undefined') Loading.show();

    API.orders.get(order.id)
      .then(res => {
        const data = res.data || res;
        const ord = data.order || order;
        const items = data.items || [];

        let itemsHtml = '';
        if (items.length === 0) {
          itemsHtml = '<tr><td colspan="5" class="py-3 text-center text-slate-400">Tidak ada item tercatat.</td></tr>';
        } else {
          items.forEach((it, idx) => {
            const prd = productCache.find(p => p.id === it.product_id) || {};
            itemsHtml += `
              <tr class="border-b border-slate-100">
                <td class="py-2.5 px-3 text-slate-600 font-mono text-xs">${idx + 1}</td>
                <td class="py-2.5 px-3">
                  <span class="font-semibold text-slate-800 text-sm block">${prd.name || it.product_id}</span>
                  <span class="text-[11px] text-slate-400 font-mono">${prd.code || it.product_id}</span>
                </td>
                <td class="py-2.5 px-3 text-right font-mono text-sm">${Number(it.quantity).toLocaleString('id-ID')} ${prd.unit || 'pcs'}</td>
                <td class="py-2.5 px-3 text-right font-mono text-xs">Rp ${Number(it.price).toLocaleString('id-ID')}</td>
                <td class="py-2.5 px-3 text-right font-bold font-mono text-sm text-slate-900">Rp ${Number(it.subtotal).toLocaleString('id-ID')}</td>
              </tr>
            `;
          });
        }

        const modalBody = Modal.create({
          title: `Detail Order: ${ord.order_no || ord.id} (${ord.type})`,
          onClose: () => {}
        });

        modalBody.innerHTML = `
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-lg text-xs border border-slate-100">
              <div>
                <span class="text-slate-400 block">${ord.type === 'PURCHASE' ? 'Pemasok (Supplier):' : 'Pelanggan (Customer):'}</span>
                <span class="font-bold text-slate-800 text-sm">${ord.contact_name}</span>
              </div>
              <div>
                <span class="text-slate-400 block">${ord.type === 'PURCHASE' ? 'Gudang Tujuan Masuk:' : 'Gudang Pengirim:'}</span>
                <span class="font-bold text-slate-800">${ord.destination_warehouse_id}</span>
              </div>
              <div>
                <span class="text-slate-400 block">Tanggal Transaksi:</span>
                <span class="font-semibold text-slate-700">${ord.date || '-'}</span>
              </div>
              <div>
                <span class="text-slate-400 block">Status:</span>
                <span class="gas-badge ${ord.status === 'completed' || ord.status === 'received' ? 'gas-badge-success' : 'gas-badge-primary'}">${ord.status}</span>
              </div>
              ${ord.approved_by ? `<div class="col-span-2 text-[11px] text-slate-500">Disetujui: <b>${ord.approved_by}</b> (${ord.approved_at || '-'})</div>` : ''}
              ${ord.received_by ? `<div class="col-span-2 text-[11px] text-slate-500">Diterima Gudang: <b>${ord.received_by}</b> (${ord.received_at || '-'})</div>` : ''}
            </div>

            ${ord.attachment_url ? `
              <div class="border border-slate-200 rounded-lg p-3 bg-white">
                <span class="text-xs font-bold text-slate-700 block mb-1.5">📸 Bukti Foto Struk / Nota / Transfer:</span>
                <a href="${ord.attachment_url}" target="_blank" class="inline-block group relative rounded-lg overflow-hidden border border-slate-200 hover:border-blue-500 transition-all">
                  <img src="${ord.attachment_url}" alt="Bukti Penjualan" class="max-h-48 rounded object-cover" onerror="this.src=''; this.alt='Klik link untuk buka foto Drive';" />
                  <span class="text-[11px] text-blue-600 block mt-1 hover:underline">Buka Foto Asli di Google Drive &rarr;</span>
                </a>
              </div>
            ` : ''}

            <div class="border border-slate-200 rounded-lg overflow-hidden">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-wider">
                  <tr>
                    <th class="py-2.5 px-3 w-8">#</th>
                    <th class="py-2.5 px-3">Produk</th>
                    <th class="py-2.5 px-3 text-right">Kuantitas</th>
                    <th class="py-2.5 px-3 text-right">Harga</th>
                    <th class="py-2.5 px-3 text-right">Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsHtml}
                </tbody>
                <tfoot class="bg-slate-50 border-t border-slate-200 font-bold">
                  <tr>
                    <td colspan="4" class="py-2.5 px-3 text-right text-slate-700">Total Transaksi:</td>
                    <td class="py-2.5 px-3 text-right font-mono text-base text-blue-700">Rp ${Number(ord.total_amount || 0).toLocaleString('id-ID')}</td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <div class="flex justify-end pt-2">
              <button type="button" onclick="Modal.hide()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                Tutup
              </button>
            </div>
          </div>
        `;
      })
      .catch(err => Toast.show(err.message || 'Gagal memuat detail order.', 'error'))
      .finally(() => { if (typeof Loading !== 'undefined') Loading.hide(); });
  }

  function openCreatePurchaseModal() {
    openOrderFormModal('PURCHASE', 'Buat Purchase Order (Pengadaan Barang)', 'Gudang Tujuan Penerimaan');
  }

  function openCreateSalesModal() {
    openOrderFormModal('SALES', 'Buat Sales Order (Penjualan Barang)', 'Gudang Sumber Pengiriman');
  }

  function openOrderFormModal(type, title, whLabel) {
    if (typeof Loading !== 'undefined') Loading.show();

    Promise.all([
      API.warehouses.list(),
      API.products.list()
    ]).then(([whRes, prdRes]) => {
      const warehouses = (whRes && whRes.data) || whRes || [];
      const products = (prdRes && prdRes.data) || prdRes || [];

      let whOptions = warehouses.map(w => `<option value="${w.id}">${w.name} (${w.code})</option>`).join('');
      let prdOptions = products.map(p => `<option value="${p.id}" data-price="${type === 'PURCHASE' ? (p.cost_price || p.price) : p.price}">${p.name} (Stok: ${p.stock || 0} ${p.unit || 'pcs'})</option>`).join('');

      const modalBody = Modal.create({
        title: title,
        onClose: () => {}
      });

      modalBody.innerHTML = `
        <form id="form-create-order" onsubmit="event.preventDefault(); OrdersTab.submitOrder('${type}');" class="space-y-4 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">${type === 'PURCHASE' ? 'Nama Pemasok (Supplier) *' : 'Nama Pelanggan (Customer) *'}</label>
              <input type="text" id="order-contact" required placeholder="${type === 'PURCHASE' ? 'PT Supplier Abadi' : 'Pelanggan Toko'}" class="w-full p-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">${whLabel} *</label>
              <select id="order-wh" required class="w-full p-2 border border-slate-200 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500">
                <option value="">-- Pilih Lokasi Gudang --</option>
                ${whOptions}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">No. Referensi / Surat Jalan (Opsional)</label>
              <input type="text" id="order-no" placeholder="Otomatis jika kosong" class="w-full p-2 border border-slate-200 rounded-lg text-xs" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Tanggal Transaksi</label>
              <input type="date" id="order-date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border border-slate-200 rounded-lg text-xs" />
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Catatan Tambahan</label>
            <textarea id="order-notes" rows="2" placeholder="Catatan transaksi..." class="w-full p-2 border border-slate-200 rounded-lg text-xs"></textarea>
          </div>

          <!-- Upload Foto Bukti Struk / Transfer Opsional -->
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
            <div class="flex items-center justify-between">
              <label class="block font-bold text-slate-700">📸 Foto Bukti Struk / Transfer / Serah Terima (Opsional)</label>
              <span class="text-[10px] text-slate-400">Kompresi Otomatis</span>
            </div>
            <input type="file" id="order-photo-input" accept="image/*" capture="environment" onchange="OrdersTab.handlePhotoSelected(this)" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
            
            <!-- Thumbnail Preview Box -->
            <div id="order-photo-preview-box" class="hidden items-center space-x-3 pt-2">
              <img id="order-photo-preview-img" src="" class="w-14 h-14 object-cover rounded-lg border border-slate-200 shadow-xs" />
              <div>
                <span id="order-photo-name" class="font-medium text-slate-800 text-[11px] block truncate max-w-[200px]">struk.jpg</span>
                <button type="button" onclick="OrdersTab.clearSelectedPhoto()" class="text-rose-600 hover:underline text-[11px] font-semibold mt-0.5">Hapus Foto</button>
              </div>
            </div>
          </div>

          <div class="border-t border-slate-100 pt-3">
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-slate-800">Daftar Barang</span>
              <button type="button" onclick="OrdersTab.addItemRow()" class="text-blue-600 hover:text-blue-700 font-semibold text-xs">+ Tambah Item</button>
            </div>
            <div id="order-items-container" class="space-y-2">
              <!-- Injected item rows -->
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <div class="text-xs text-slate-600">
              Total: <span id="order-total-preview" class="font-bold font-mono text-base text-blue-700">Rp 0</span>
            </div>
            <div class="space-x-2">
              <button type="button" onclick="Modal.hide()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Batal</button>
              <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm">
                ${type === 'PURCHASE' ? 'Simpan Draft PO' : 'Selesaikan Penjualan (SO)'}
              </button>
            </div>
          </div>
        </form>
      `;

      window._orderPrdList = products.map(p => ({
        value: p.id,
        label: p.name,
        sublabel: `${p.code || p.id} • Stok: ${p.stock || 0} ${p.unit || 'pcs'} • Rp ${(type === 'PURCHASE' ? (p.cost_price || p.price) : p.price).toLocaleString('id-ID')}`,
        price: type === 'PURCHASE' ? (p.cost_price || p.price) : p.price,
        stock: p.stock || 0,
        unit: p.unit || 'pcs'
      }));

      addItemRow();
    }).finally(() => {
      if (typeof Loading !== 'undefined') Loading.hide();
    });
  }

  function addItemRow() {
    const container = document.getElementById('order-items-container');
    if (!container) return;

    const rowId = 'ord-item-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
    const div = document.createElement('div');
    div.id = rowId;
    div.className = 'flex items-center space-x-2 bg-slate-50 p-2 rounded-lg border border-slate-100';
    div.innerHTML = `
      <div class="flex-1" id="${rowId}-combo-container">
        <!-- Searchable Combobox Injected Here -->
      </div>
      <div class="w-20">
        <input type="number" min="1" placeholder="Qty" oninput="OrdersTab.recalcTotal()" class="ord-item-qty w-full p-1.5 border border-slate-300 rounded text-xs bg-white text-right focus:border-blue-500 focus:outline-hidden" required />
      </div>
      <div class="w-28">
        <input type="number" min="0" placeholder="Harga" oninput="OrdersTab.recalcTotal()" class="ord-item-price w-full p-1.5 border border-slate-300 rounded text-xs bg-white text-right focus:border-blue-500 focus:outline-hidden" required />
      </div>
      <button type="button" onclick="document.getElementById('${rowId}').remove(); OrdersTab.recalcTotal();" class="text-red-500 hover:text-red-700 p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </button>
    `;
    container.appendChild(div);

    // Inisialisasi Searchable Combobox untuk baris produk ini
    if (typeof Combobox !== 'undefined') {
      Combobox.render({
        container: `${rowId}-combo-container`,
        options: window._orderPrdList || [],
        placeholder: '-- Ketik / Cari Nama atau Kode Produk --',
        name: 'product_id',
        required: true,
        onChange: function(selected) {
          const priceInput = div.querySelector('.ord-item-price');
          if (priceInput && selected && selected.price !== undefined) {
            priceInput.value = selected.price;
          }
          recalcTotal();
        }
      });
    }
  }

  function recalcTotal() {
    const qtys = document.querySelectorAll('.ord-item-qty');
    const prices = document.querySelectorAll('.ord-item-price');
    let total = 0;
    for (let i = 0; i < qtys.length; i++) {
      const q = Number(qtys[i].value) || 0;
      const p = Number(prices[i].value) || 0;
      total += (q * p);
    }
    const previewEl = document.getElementById('order-total-preview');
    if (previewEl) {
      previewEl.innerText = 'Rp ' + total.toLocaleString('id-ID');
    }
  }

  function submitOrder(type) {
    const contact = document.getElementById('order-contact')?.value;
    const wh = document.getElementById('order-wh')?.value;
    const orderNo = document.getElementById('order-no')?.value;
    const orderDate = document.getElementById('order-date')?.value;
    const notes = document.getElementById('order-notes')?.value;

    if (!contact || !wh) {
      Toast.show('Nama kontak dan gudang wajib diisi.', 'warning');
      return;
    }

    const rowEls = document.querySelectorAll('#order-items-container > div');
    const items = [];

    rowEls.forEach(row => {
      const pInput = row.querySelector('input[name="product_id"]') || row.querySelector('.ord-item-product');
      const qInput = row.querySelector('.ord-item-qty');
      const prInput = row.querySelector('.ord-item-price');
      const pId = pInput ? pInput.value : '';
      const q = qInput ? Number(qInput.value) || 0 : 0;
      const p = prInput ? Number(prInput.value) || 0 : 0;
      if (pId && q > 0) {
        items.push({ product_id: pId, quantity: q, price: p });
      }
    });

    if (items.length === 0) {
      Toast.show('Minimal masukkan 1 barang dengan memilih produk dan mengisi kuantitas.', 'warning');
      return;
    }

    if (typeof Loading !== 'undefined') Loading.show();

    // Async upload foto jika ada
    (async function() {
      try {
        let uploadedPhotoUrl = '';
        if (window._selectedOrderPhoto && window._selectedOrderPhoto.base64Data) {
          const uploadRes = await API.drive.uploadPhoto({
            base64Data: window._selectedOrderPhoto.base64Data,
            filename: `SO_${orderNo || Date.now()}_STRUK.jpg`,
            category: 'Penjualan'
          });
          if (uploadRes) {
            uploadedPhotoUrl = uploadRes.url || (uploadRes.data && uploadRes.data.url) || '';
          }
        }

        const payload = {
          orderData: {
            order_no: orderNo,
            date: orderDate,
            destination_warehouse_id: wh,
            contact_name: contact,
            notes: notes,
            attachment_url: uploadedPhotoUrl
          },
          items: items
        };

        const apiCall = (type === 'PURCHASE') ? API.orders.createPurchase(payload) : API.orders.createSales(payload);

        apiCall
          .then(res => {
            Toast.show(type === 'PURCHASE' ? 'Draft Purchase Order berhasil dibuat.' : 'Transaksi penjualan berhasil diselesaikan!', 'success');
            Modal.hide();
            loadData();
          })
          .catch(err => Toast.show(err.message || 'Gagal memproses pesanan.', 'error'))
          .finally(() => { if (typeof Loading !== 'undefined') Loading.hide(); });
      } catch (err) {
        if (typeof Loading !== 'undefined') Loading.hide();
        Toast.show(err.message || 'Gagal mengunggah foto struk.', 'error');
      }
    })();
  }

  function handlePhotoSelected(inputEl) {
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;

    if (typeof Loading !== 'undefined') Loading.show();
    ImageCompressor.compress(file, { maxDimension: 1200, quality: 0.75 })
      .then(res => {
        window._selectedOrderPhoto = res;
        const box = document.getElementById('order-photo-preview-box');
        const img = document.getElementById('order-photo-preview-img');
        const name = document.getElementById('order-photo-name');
        if (box && img) {
          img.src = res.base64Data;
          if (name) name.innerText = `${file.name} (${Math.round(res.base64Data.length * 0.75 / 1024)} KB)`;
          box.classList.remove('hidden');
          box.classList.add('flex');
        }
      })
      .catch(err => {
        Toast.show(err.message || 'Gagal memproses gambar.', 'error');
      })
      .finally(() => {
        if (typeof Loading !== 'undefined') Loading.hide();
      });
  }

  function clearSelectedPhoto() {
    window._selectedOrderPhoto = null;
    const inputEl = document.getElementById('order-photo-input');
    const box = document.getElementById('order-photo-preview-box');
    if (inputEl) inputEl.value = '';
    if (box) {
      box.classList.add('hidden');
      box.classList.remove('flex');
    }
  }

  return {
    init: init,
    switchType: switchType,
    loadData: loadData,
    openCreatePurchaseModal: openCreatePurchaseModal,
    openCreateSalesModal: openCreateSalesModal,
    addItemRow: addItemRow,
    onProductSelect: onProductSelect,
    recalcTotal: recalcTotal,
    handlePhotoSelected: handlePhotoSelected,
    clearSelectedPhoto: clearSelectedPhoto,
    submitOrder: submitOrder
  };
})();

window.initOrdersTab = function() {
  OrdersTab.init();
};
</script>
