<div class="mb-5 flex items-center justify-between">
  <div>
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Kategori Produk</h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Kelola kategori produk untuk pengelompokan dan pencarian yang lebih mudah</p>
  </div>
  <!-- Desktop Add Button -->
  <button id="btn-add-category" onclick="CategoriesTab.openCreateModal()" class="app-desktop-inline items-center space-x-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    <span>+ Tambah Kategori</span>
  </button>
</div>

<!-- Mobile Floating Action Button (FAB) -->
<button 
  id="fab-add-category"
  onclick="CategoriesTab.openCreateModal()" 
  class="app-mobile-only fixed bottom-20 right-4 z-40 w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg shadow-blue-600/30 flex items-center justify-center transition-transform active:scale-95"
  title="Tambah Kategori Cepat"
>
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
</button>

<div id="categories-table-container"></div>

<script>
const CategoriesTab = (function() {
  const tableContainerId = 'categories-table-container';
  let isInitialized = false;

  function updateAccessUI() {
    const canCreate = typeof Auth !== 'undefined' && Auth.can('categories', 'create');
    const desktopBtn = document.getElementById('btn-add-category');
    const fabBtn = document.getElementById('fab-add-category');
    if (desktopBtn) desktopBtn.style.display = canCreate ? '' : 'none';
    if (fabBtn) fabBtn.style.display = canCreate ? '' : 'none';
  }

  function init() {
    updateAccessUI();
    if (!isInitialized) {
      loadData();
      isInitialized = true;
    } else {
      loadData();
    }
  }

  function loadData() {
    updateAccessUI();
    if (typeof Loading !== 'undefined') Loading.show();

    const actions = [];
    if (typeof Auth !== 'undefined') {
      if (Auth.can('categories', 'edit')) actions.push('edit');
      if (Auth.can('categories', 'delete')) actions.push('delete');
    } else {
      actions.push('edit', 'delete');
    }

    API.categories.list()
      .then(function(data) {
        if (typeof Table !== 'undefined') {
          Table.render({
            target: tableContainerId,
            data: data || [],
            columns: CategorySchema.columns,
            actions: actions,
            onAction: handleAction
          });
        }
      })
      .catch(function(err) {
        if (typeof Toast !== 'undefined') Toast.error(err.message);
        console.error(err);
      })
      .finally(function() {
        if (typeof Loading !== 'undefined') Loading.hide();
      });
  }

  function handleAction(action, row) {
    if (action === 'edit') {
      openEditModal(row);
    } else if (action === 'delete') {
      if (typeof Auth !== 'undefined' && !Auth.can('categories', 'delete')) {
        if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk menghapus kategori.');
        else alert('Anda tidak memiliki izin untuk menghapus kategori.');
        return;
      }
      if (confirm('Apakah Anda yakin ingin menghapus kategori "' + (row.name || row.id) + '"?')) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.categories.delete(row.id)
          .then(function() {
            if (typeof Toast !== 'undefined') Toast.success('Kategori berhasil dihapus');
            loadData();
          })
          .catch(function(err) {
            if (typeof Toast !== 'undefined') Toast.error(err.message);
          })
          .finally(function() {
            if (typeof Loading !== 'undefined') Loading.hide();
          });
      }
    }
  }

  function openCreateModal() {
    if (typeof Auth !== 'undefined' && !Auth.can('categories', 'create')) {
      if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk menambah kategori.');
      else alert('Anda tidak memiliki izin untuk menambah kategori.');
      return;
    }
    if (typeof Modal === 'undefined' || typeof Form === 'undefined') return;
    var modalBody = Modal.create({
      title: 'Tambah Kategori Baru',
      onClose: function() {}
    });
    modalBody.id = 'categories-form-container';

    Form.render({
      containerId: 'categories-form-container',
      schema: CategorySchema,
      mode: 'create',
      onSubmit: function(data) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.categories.create(data)
          .then(function() {
            Modal.hide();
            if (typeof Toast !== 'undefined') Toast.success('Kategori berhasil ditambahkan');
            loadData();
          })
          .catch(function(err) {
            if (typeof Toast !== 'undefined') Toast.error(err.message);
          })
          .finally(function() {
            if (typeof Loading !== 'undefined') Loading.hide();
          });
      },
      onCancel: function() { Modal.hide(); }
    });
  }

  function openEditModal(row) {
    if (typeof Auth !== 'undefined' && !Auth.can('categories', 'edit')) {
      if (typeof Toast !== 'undefined') Toast.error('Anda tidak memiliki izin untuk mengubah kategori.');
      else alert('Anda tidak memiliki izin untuk mengubah kategori.');
      return;
    }
    if (typeof Modal === 'undefined' || typeof Form === 'undefined') return;
    var modalBody = Modal.create({
      title: 'Edit Kategori: ' + (row.name || row.id),
      onClose: function() {}
    });
    modalBody.id = 'categories-form-container';

    Form.render({
      containerId: 'categories-form-container',
      schema: CategorySchema,
      mode: 'edit',
      data: row,
      onSubmit: function(data) {
        if (typeof Loading !== 'undefined') Loading.show();
        API.categories.update(row.id, data)
          .then(function() {
            Modal.hide();
            if (typeof Toast !== 'undefined') Toast.success('Kategori berhasil diperbarui');
            loadData();
          })
          .catch(function(err) {
            if (typeof Toast !== 'undefined') Toast.error(err.message);
          })
          .finally(function() {
            if (typeof Loading !== 'undefined') Loading.hide();
          });
      },
      onCancel: function() { Modal.hide(); }
    });
  }

  return { init: init, loadData: loadData, openCreateModal: openCreateModal, openEditModal: openEditModal, handleAction: handleAction };
})();

// Hook for Scripts.html navigation lifecycle
window.initCategoriesTab = function() {
  CategoriesTab.init();
};
</script>
