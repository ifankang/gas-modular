<script>
  /**
   * Frontend API Adapter
   * Converts google.script.run to Promises.
   */
  const API = {
    call: function(methodName, ...args) {
      const serverArgs = [...args];
      if (!methodName.startsWith('auth')) {
        let token = null;
        try {
          const stored = localStorage.getItem('gas_auth_user');
          if (stored) {
            const user = JSON.parse(stored);
            token = user?.token || null;
          }
        } catch (e) {
          console.error('Error retrieving session token:', e);
        }
        serverArgs.push(token);
      }

      return new Promise((resolve, reject) => {
        // Fallback for development outside GAS
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          console.warn(`[DEV MODE] Mocking API call: ${methodName}`, serverArgs);
          setTimeout(() => {
            resolve({ id: 'MOCK-1', _method: methodName, _args: serverArgs });
          }, 500);
          return;
        }

        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.success) {
              resolve(response.data);
            } else {
              reject(new Error(response?.message || 'Unknown server error'));
            }
          })
          .withFailureHandler((error) => {
            reject(error);
          })
          [methodName](...serverArgs);
      });
    },
    
    auth: {
      login: (email, password) => API.call('authLogin', email, password)
    },
    
    // Generic CRUD endpoints mapped to server controllers
    users: {
      list: () => API.call('usersList'),
      get: (id) => API.call('usersGet', id),
      create: (data) => API.call('usersCreate', data),
      update: (id, data) => API.call('usersUpdate', id, data),
      delete: (id) => API.call('usersDelete', id)
    },
    
    products: {
      list: () => API.call('productsList'),
      get: (id) => API.call('productsGet', id),
      create: (data) => API.call('productsCreate', data),
      update: (id, data) => API.call('productsUpdate', id, data),
      delete: (id) => API.call('productsDelete', id)
    },

    orders: {
      list: (type) => API.call('ordersList', type),
      get: (id) => API.call('ordersGet', id),
      createPurchase: (payload) => API.call('ordersCreatePurchase', payload),
      approvePurchase: (id) => API.call('ordersApprovePurchase', id),
      shipPurchase: (id) => API.call('ordersShipPurchase', id),
      receivePurchase: (id) => API.call('ordersReceivePurchase', id),
      createSales: (payload) => API.call('ordersCreateSales', payload)
    },


    roles: {
      list: () => API.call('rolesList'),
      get: (id) => API.call('rolesGet', id),
      create: (data) => API.call('rolesCreate', data),
      update: (id, data) => API.call('rolesUpdate', id, data),
      delete: (id) => API.call('rolesDelete', id),
      seed: () => API.call('rolesSeed')
    },

    categories: {
      list: () => API.call('categoriesList'),
      get: (id) => API.call('categoriesGet', id),
      create: (data) => API.call('categoriesCreate', data),
      update: (id, data) => API.call('categoriesUpdate', id, data),
      delete: (id) => API.call('categoriesDelete', id)
    },

    warehouses: {
      list: () => API.call('warehousesList'),
      get: (id) => API.call('warehousesGet', id),
      create: (data) => API.call('warehousesCreate', data),
      update: (id, data) => API.call('warehousesUpdate', id, data),
      delete: (id) => API.call('warehousesDelete', id)
    },

    stocks: {
      list: () => API.call('stocksList'),
      getByProduct: (productId) => API.call('stocksGetByProduct', productId),
      getByWarehouse: (warehouseId) => API.call('stocksGetByWarehouse', warehouseId),
      setBalance: (payload) => API.call('stocksSetBalance', payload)
    },

    transfers: {
      list: () => API.call('transfersList'),
      get: (id) => API.call('transfersGet', id),
      create: (payload) => API.call('transfersCreate', payload),
      approveSend: (id) => API.call('transfersApproveSend', id),
      receive: (id) => API.call('transfersReceive', id)
    },

    mutations: {
      list: (filter) => API.call('mutationsList', filter)
    },

    reports: {
      stockCard: (params) => API.call('reportsStockCard', params),
      stockValuation: (params) => API.call('reportsStockValuation', params),
      purchases: (params) => API.call('reportsPurchases', params),
      sales: (params) => API.call('reportsSales', params),
      transfers: (params) => API.call('reportsTransfers', params),
      summary: () => API.call('reportsSummary')
    }
  };
</script>
