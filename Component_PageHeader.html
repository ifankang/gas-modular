<script>
  /**
   * PageHeader Component
   */
  const PageHeader = {
    /**
     * Generate HTML string for page header
     * @param {string} title 
     * @param {string} description 
     * @param {string} actionsHtml 
     */
    render: function(title, description = '', actionsHtml = '') {
      return `
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">${title}</h1>
            ${description ? `<p class="text-sm text-gray-500 mt-1">${description}</p>` : ''}
          </div>
          ${actionsHtml ? `<div class="mt-4 sm:mt-0 flex gap-2">${actionsHtml}</div>` : ''}
        </div>
      `;
    }
  };
  window.PageHeader = PageHeader;
</script>
